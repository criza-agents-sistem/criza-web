<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pablo Javier Díaz Azulay — CRIZA. Guardá mi contacto.">
<meta name="theme-color" content="#01040B">
<meta property="og:title" content="Pablo Javier Díaz Azulay · CRIZA">
<meta property="og:description" content="Guardá mi contacto y conocé CRIZA — plataforma de innovación aplicada.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://criza.bio/tarjeta/pablo">
<meta property="og:image" content="https://criza.bio/assets/logo.png">
<link rel="icon" href="/assets/logo.png">
<title>Pablo Javier Díaz Azulay · CRIZA</title>
<style>
  :root {
    --bg: #01040B; --ink: #F1EDE2; --dim: #A9A190; --line: rgba(255,255,255,.12);
    --husk: #DB7C40; --green: #6F9D80;
    --f-serif: "DM Serif Display", Georgia, "Times New Roman", serif;
    --f-body: "Quicksand", "Helvetica Neue", Arial, sans-serif;
    --f-label: "Cinzel", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #090c12; color: var(--ink);
    font-family: var(--f-body); line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.75);
  }
  .hdr { position: relative; height: 190px; border-bottom: 1px solid var(--line); }
  .hdr .net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hdr .logo {
    position: absolute; left: 24px; bottom: 20px; width: 118px; height: 30px;
    background: var(--ink);
    -webkit-mask: url("/assets/logo.svg") no-repeat left center / contain;
            mask: url("/assets/logo.svg") no-repeat left center / contain;
  }
  .body { padding: 26px 24px 20px; }
  .greet {
    font-family: var(--f-serif); font-weight: 400; font-size: 1.05rem;
    color: var(--husk); margin: 0 0 18px; line-height: 1.3;
  }
  .photo {
    width: 78px; height: 78px; border-radius: 999px; border: 1px solid var(--line);
    background: #12161f; color: var(--dim); display: grid; place-items: center;
    font-family: var(--f-serif); font-size: 1.5rem; letter-spacing: .02em;
    margin-bottom: 16px; overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: var(--f-serif); font-weight: 400; font-size: 1.7rem;
    line-height: 1.12; margin: 0 0 .35rem; text-wrap: balance;
  }
  .org {
    font-family: var(--f-label); font-size: .64rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--green); margin: 0 0 22px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: .55rem;
    font-family: var(--f-label); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
    text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); background: transparent;
    padding: 15px 16px; border-radius: 11px; width: 100%; cursor: pointer;
    transition: border-color .2s, background .2s, transform .1s;
    -webkit-appearance: none; appearance: none;
  }
  .btn:active { transform: scale(.985); background: rgba(255,255,255,.05); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn-primary { background: var(--husk); border-color: var(--husk); color: #180d04; font-weight: 700; }
  .btn-ghost { color: var(--dim); border-color: transparent; padding: 12px 16px; }
  .row { display: flex; gap: 10px; margin: 10px 0; }
  .row .btn { margin: 0; }
  .btn + .btn { margin-top: 10px; }
  .qr-wrap {
    margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); text-align: center;
  }
  .qr-wrap .lbl {
    font-family: var(--f-label); font-size: .58rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dim); margin: 0 0 12px;
  }
  #qr { display: inline-block; padding: 12px; background: #fff; border-radius: 12px; line-height: 0; }
  #qr img, #qr canvas { display: block; }
  footer {
    padding: 16px 24px 22px; border-top: 1px solid var(--line);
    font-family: var(--f-label); font-size: .56rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap">
</head>
<body>

<main class="card">
  <div class="hdr">
    <canvas class="net" aria-hidden="true"></canvas>
    <span class="logo" role="img" aria-label="CRIZA"></span>
  </div>
  <div class="body">
    <p class="greet" hidden></p>
    <div class="photo" aria-hidden="true">PD</div>
    <h1>Pablo Javier Díaz Azulay</h1>
    <p class="org">CRIZA · plataforma de innovación aplicada</p>

    <a class="btn btn-primary" id="vcard" download="Pablo Diaz Azulay.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Guardar contacto
    </a>
    <div class="row">
      <a class="btn" href="https://wa.me/5493516880339" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" href="mailto:hola@criza.bio">Escribir</a>
    </div>
    <a class="btn btn-ghost" href="https://criza.bio" target="_blank" rel="noopener">Ver el sitio &rarr;</a>
    <button class="btn btn-ghost" id="share" type="button">Compartir esta tarjeta</button>

    <div class="qr-wrap">
      <p class="lbl">Escaneá para abrir esta tarjeta</p>
      <div id="qr"></div>
    </div>
  </div>
  <footer>criza.bio · © 2026 CRIZA</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var PERSON = {
    fn: "Pablo Javier Díaz Azulay",
    n: "Díaz Azulay;Pablo Javier;;;",
    tel: "+5493516880339",
    email: "hola@criza.bio",
    file: "Pablo Diaz Azulay.vcf",
    url: "https://criza.bio/tarjeta/pablo"
  };

  var vcard = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:" + PERSON.n, "FN:" + PERSON.fn, "ORG:CRIZA",
    "TEL;TYPE=CELL:" + PERSON.tel,
    "EMAIL;TYPE=WORK:" + PERSON.email,
    "URL:https://criza.bio",
    "NOTE:Plataforma de innovación aplicada. criza.bio",
    "END:VCARD"
  ].join("\r\n");
  var a = document.getElementById("vcard");
  try {
    a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
  }

  var q = new URLSearchParams(location.search);
  var de = (q.get("de") || "").trim(), en = (q.get("en") || "").trim();
  if (de || en) {
    var g = document.querySelector(".greet"), t = "";
    if (en) t = "Gracias por la charla en " + en + ".";
    if (de) t = (t ? t + " " : "") + "Un gusto, " + de + ".";
    g.textContent = t; g.hidden = false;
  }

  var s = document.getElementById("share");
  s.addEventListener("click", function () {
    var data = { title: PERSON.fn + " · CRIZA", text: "Mi tarjeta de contacto", url: PERSON.url };
    if (navigator.share) { navigator.share(data).catch(function () {}); }
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(PERSON.url).then(function () {
        s.textContent = "Link copiado ✓";
        setTimeout(function () { s.textContent = "Compartir esta tarjeta"; }, 1800);
      });
    }
  });

  if (window.QRCode) {
    new QRCode(document.getElementById("qr"), {
      text: PERSON.url, width: 168, height: 168,
      colorDark: "#01040B", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  var c = document.querySelector(".net");
  if (c && c.getContext) {
    var x = c.getContext("2d"), host = c.parentElement;
    var W = 0, H = 0, DPR = 1, pts = [], raf = 0;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function lerp(p, r, t) { return [Math.round(p[0]+(r[0]-p[0])*t), Math.round(p[1]+(r[1]-p[1])*t), Math.round(p[2]+(r[2]-p[2])*t)]; }
    function ramp(t) {
      var w = [244,66,8], m = [251,138,14], g = [24,150,94];
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      return t < 0.5 ? lerp(w, m, t * 2) : lerp(m, g, (t - 0.5) * 2);
    }
    function size() {
      var r = host.getBoundingClientRect(); W = r.width; H = r.height;
      DPR = Math.min(2, window.devicePixelRatio || 1);
      c.width = W * DPR; c.height = H * DPR; c.style.width = W + "px"; c.style.height = H + "px";
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      var n = Math.max(14, Math.min(34, Math.round(W * H / 5200)));
      pts = [];
      for (var i = 0; i < n; i++) pts.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.22 });
    }
    function frame(step) {
      var LINK = Math.min(150, Math.max(90, W / 3));
      x.clearRect(0, 0, W, H);
      if (step) {
        for (var i = 0; i < pts.length; i++) {
          var p = pts[i]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > W) p.vx *= -1;
          if (p.y < 0 || p.y > H) p.vy *= -1;
          p.x = Math.max(0, Math.min(W, p.x)); p.y = Math.max(0, Math.min(H, p.y));
        }
      }
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        for (var j = i + 1; j < pts.length; j++) {
          var b = pts[j], d = Math.hypot(p.x - b.x, p.y - b.y);
          if (d > LINK) continue;
          var col = ramp(p.x / W), al = (1 - d / LINK) * 0.8;
          x.strokeStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + al.toFixed(3) + ")";
          x.lineWidth = 1.3;
          x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(b.x, b.y); x.stroke();
          if (d < 26) {
            var k = 1 - d / 26;
            x.fillStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + k.toFixed(3) + ")";
            x.beginPath(); x.arc((p.x+b.x)/2, (p.y+b.y)/2, 3, 0, 6.2832); x.fill();
          }
        }
        var cc = ramp(p.x / W);
        x.fillStyle = "rgba(" + cc[0] + "," + cc[1] + "," + cc[2] + ",.85)";
        x.beginPath(); x.arc(p.x, p.y, 1.6, 0, 6.2832); x.fill();
      }
    }
    function loop() { frame(true); raf = requestAnimationFrame(loop); }
    size(); frame(false);
    if (!reduce) loop();
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { size(); frame(false); }, 150); });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
      else if (!raf && !reduce) loop();
    });
  }
})();
</script>
</body>
</html>
