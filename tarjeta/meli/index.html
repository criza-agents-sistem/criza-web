<style>
  :root {
    --page: #EEF6F1; --paper: #FFFFFF; --ink: #1A3347; --dim: #4F6272; --faint: #8796A2;
    --line: #DCE8E1; --green: #1F9E63; --green-2: #2BBB8B; --lime: #7BD550;
    --f-head: "Maven Pro", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font-family: var(--f-body); line-height: 1.55;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  .card {
    position: relative; isolation: isolate;
    width: 100%; max-width: 440px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(26,51,71,.05), 0 34px 64px -30px rgba(26,51,71,.28);
  }
  .card > .cells {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block;
  }
  /* Velo: deja las células visibles arriba y las atenúa detrás del texto */
  .card > .veil {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(255,255,255,0)   0px,
      rgba(255,255,255,.12) 120px,
      rgba(255,255,255,.62) 210px,
      rgba(255,255,255,.74) 55%,
      rgba(255,255,255,.78) 100%);
  }
  .inner { position: relative; z-index: 2; }
  .hdr { position: relative; height: 196px; }
  .hdr .logo {
    position: absolute; left: 22px; bottom: 18px; width: 230px; height: auto;
  }
  .body { padding: 24px 24px 20px; }
  .photo {
    width: 82px; height: 82px; border-radius: 999px; border: 1px solid var(--line);
    background: #E2F1E8; margin-bottom: 18px; overflow: hidden;
    box-shadow: 0 0 0 5px rgba(255,255,255,.7);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 {
    font-family: var(--f-head); font-weight: 700; font-size: 1.85rem;
    line-height: 1.1; margin: 0 0 .5rem; text-wrap: balance; letter-spacing: -.01em;
  }
  .org {
    position: relative; padding-left: 17px;
    font-size: .85rem; font-weight: 600; color: var(--dim); margin: 0 0 24px;
  }
  .org::before {
    content: ""; position: absolute; left: 0; top: .48em;
    width: 9px; height: 9px; border-radius: 999px;
    background: linear-gradient(135deg, var(--green), var(--lime));
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: .5rem;
    font-family: var(--f-body); font-size: .95rem; font-weight: 600; letter-spacing: 0;
    text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); background: rgba(255,255,255,.78);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    padding: 14px 16px; border-radius: 12px; width: 100%; cursor: pointer;
    transition: border-color .2s, background .2s, transform .1s;
    -webkit-appearance: none; appearance: none;
  }
  .btn:active { transform: scale(.985); background: #fff; }
  .btn svg { width: 17px; height: 17px; flex: none; }
  .btn-primary {
    background: var(--green); border-color: var(--green); color: #fff; font-weight: 700;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .btn-primary:active { background: #1A8A56; }
  .btn-product { border-color: rgba(31,158,99,.45); color: #17784B; }
  .btn-ghost {
    color: var(--dim); border-color: transparent; background: rgba(255,255,255,.5);
    padding: 12px 16px; font-weight: 500;
  }
  .row { display: flex; gap: 10px; margin: 10px 0; }
  .row .btn { margin: 0; }
  .btn + .btn { margin-top: 10px; }
  .row .btn + .btn { margin-top: 0; }
  .qr-wrap { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); text-align: center; }
  .qr-wrap .lbl { font-size: .82rem; font-weight: 500; color: var(--faint); margin: 0 0 12px; }
  #qr {
    display: inline-block; padding: 12px; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; line-height: 0;
    box-shadow: 0 0 0 6px rgba(238,246,241,.8);
  }
  #qr img, #qr canvas { display: block; }
  footer {
    padding: 16px 24px 22px; border-top: 1px solid var(--line);
    font-size: .72rem; font-weight: 500; color: var(--faint);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<main class="card">

  <div class="veil" aria-hidden="true"></div>
  <div class="inner">
    <div class="hdr">
      <img class="logo" src="/tarjeta/meli/logo-color.png" alt="MicroBigs — pequeños seres, grandes soluciones" width="230" height="44">
    </div>
    <div class="body">
      <div class="photo"><img src="/tarjeta/meli/foto.jpg" alt="Melina Gallardo" width="82" height="82"></div>
      <h1>Melina Gallardo</h1>
      <p class="org">Microbióloga · MicroBigs</p>

      <a class="btn btn-primary" id="vcard" download="Melina Gallardo.vcf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Guardar contacto

      <div class="row">
        <a class="btn" href="https://wa.me/5493584116703" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn" href="mailto:info@microbigs.ar">Email</a>

        <a class="btn" href="https://www.instagram.com/microbigs" target="_blank" rel="noopener">

          LinkedIn

      <button class="btn btn-ghost" id="share" type="button">Compartir esta tarjeta</button>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var PERSON = {
    fn: "Melina Gallardo",
    n: "Gallardo;Melina;;Lic.;",
    tel: "+5493584116703",
    email: "info@microbigs.ar",
    file: "Melina Gallardo.vcf",
    url: "https://criza.bio/tarjeta/meli"
  };

  var vcard = [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:" + PERSON.n, "FN:" + PERSON.fn, "ORG:MicroBigs", "TITLE:Microbióloga",
    "TEL;TYPE=CELL:" + PERSON.tel,
    "EMAIL;TYPE=WORK:" + PERSON.email,
    "URL:https://microbigs.ar",
    "X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/microbigs",
    "X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/melinagallardo-microbigs",
    "NOTE:Pequeños seres, grandes soluciones. microbigs.ar · Instagram @microbigs",
    "END:VCARD"
  ].join("\r\n");
  var a = document.getElementById("vcard");
  try {
    a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
  }

  var s = document.getElementById("share");
  s.addEventListener("click", function () {
    var data = { title: PERSON.fn + " · MicroBigs", text: "Mi tarjeta de contacto", url: PERSON.url };
    if (navigator.share) { navigator.share(data).catch(function () {}); }
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(PERSON.url).then(function () {
        s.textContent = "Link copiado ✓";
        setTimeout(function () { s.textContent = "Compartir esta tarjeta"; }, 1800);
      });
    }
  });

  if (window.QRCode) {
    new QRCode(document.getElementById("qr"), {
      text: PERSON.url, width: 168, height: 168,
      colorDark: "#1A3347", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // Fondo: células que flotan despacio, en los verdes de la marca
  var c = document.querySelector(".cells");
  if (c && c.getContext) {
    var x = c.getContext("2d"), host = c.parentElement;
    var W = 0, H = 0, DPR = 1, cells = [], raf = 0, t = 0;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var COLS = [[31,158,99], [43,187,139], [123,213,80], [82,188,89]];
    function size() {
      var r = host.getBoundingClientRect(); W = r.width; H = r.height;
      DPR = Math.min(2, window.devicePixelRatio || 1);
      c.width = W * DPR; c.height = H * DPR; c.style.width = W + "px"; c.style.height = H + "px";
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
      var n = Math.max(14, Math.min(30, Math.round(W * H / 11000)));
      cells = [];
      for (var i = 0; i < n; i++) {
        cells.push({
          x: Math.random() * W, y: Math.random() * H,
          r: 6 + Math.random() * 22,
          vx: (Math.random() - 0.5) * 0.18, vy: -(0.06 + Math.random() * 0.16),
          ph: Math.random() * 6.28, col: COLS[i % COLS.length],
          a: 0.16 + Math.random() * 0.22
        });
      }
    }
    function frame(step) {
      x.clearRect(0, 0, W, H);
      if (step) t += 0.012;
      for (var i = 0; i < cells.length; i++) {
        var p = cells[i];
        if (step) {
          p.x += p.vx + Math.sin(t + p.ph) * 0.08; p.y += p.vy;
          if (p.y < -p.r * 2) { p.y = H + p.r * 2; p.x = Math.random() * W; }
          if (p.x < -p.r * 2) p.x = W + p.r; if (p.x > W + p.r * 2) p.x = -p.r;
        }
        var wob = 1 + Math.sin(t * 1.7 + p.ph) * 0.06;
        var g = x.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.1, p.x, p.y, p.r * wob);
        g.addColorStop(0, "rgba(" + p.col.join(",") + "," + (p.a * 0.55).toFixed(3) + ")");
        g.addColorStop(1, "rgba(" + p.col.join(",") + "," + p.a.toFixed(3) + ")");
        x.fillStyle = g;
        x.beginPath(); x.ellipse(p.x, p.y, p.r * wob, p.r / wob, p.ph, 0, 6.2832); x.fill();
        x.strokeStyle = "rgba(" + p.col.join(",") + "," + Math.min(1, p.a + 0.25).toFixed(3) + ")";
        x.lineWidth = 1.2; x.stroke();
      }
    }
    function loop() { frame(true); raf = requestAnimationFrame(loop); }
    size(); frame(false);
    if (!reduce) loop();
    var rt;
    window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { size(); frame(false); }, 150); });
    if (window.ResizeObserver) {
      new ResizeObserver(function () { size(); if (!raf) frame(false); }).observe(host);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
      else if (!raf && !reduce) loop();
    });
  }
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", function () {
      navigator.serviceWorker.register("/tarjeta/sw.js", { scope: "/tarjeta/" }).catch(function () {});
    });
  }
</script>
</body>
